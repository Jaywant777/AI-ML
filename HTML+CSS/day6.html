<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day_6</title>
</head>

<body>

    <!-- form tag <form action=""></form> is an container action method get past lable, input -->
    <form action="" method="">

        <!-- Use 'text' for any text  -->
        <label for="cn1">Name</label>
        <input type="text" name="name" id="cn1">
        <br><br>

        <!-- Use 'email' for enter email -->
        <label for="cn2">Email</label>
        <input type="email" name="Email" id="cn2">
        <br><br>

        <!-- Use tel For Phone number -->
        <label for="cn3">Phone</label>
        <input type="tel" name="Phone" id="cn3">
        <br><br>

        <!-- Use password to hide password -->
        <label for="cn4">Password</label>
        <input type="password" name="password" id="cn4">
        <br><br>
        

        <button>submit</button>

    </form>



</body>

</html>
